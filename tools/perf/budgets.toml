#
# Perf-gate budgets per tier. The `gate` bin
# (benches/regression/src/bin/gate.rs) takes `--tier <bsd|lsm>` and
# enforces the matching section's `[[<tier>.gate]]` entries against
# bench JSON outputs.
#
# Workflows:
#   - .github/workflows/perf-bsd.yml passes --tier bsd
#   - .github/workflows/perf-lsm.yml passes --tier lsm
#
# Units:
#   - p50_us / p99_us / fail_at_p99_us — microseconds (latency
#     gates). Lower is better.
#   - For THROUGHPUT-shaped workloads, the bin's per-iter elapsed
#     should stay BELOW these or throughput drops; the gate fails
#     when actual p50/p99 EXCEEDS the budgets (i.e. iter slowed
#     down, throughput dropped).
#   - kind = "latency" (default) for latency-style gates;
#     kind = "throughput" for fixed-unit-of-work iters.
#
# Both BSD and LSM tiers bake ~30% slop for CI jitter (BSD: the
# cross-platform-actions VM; LSM: the AR00 self-hosted runner
# under variable load). Adjust budgets here (not silently in the
# workflow) when a systematic shift is observed across many runs.

# =====================================================================
# BSD tier (B07 — perf-bsd.yml inside the FreeBSD cross-platform-actions
# VM)
# =====================================================================

[[bsd.gate]]
name = "doctor"
description = "shit doctor --json total runtime"
kind = "latency"
p50_us = 500_000
p99_us = 1_500_000
fail_at_p99_us = 2_000_000

[[bsd.gate]]
name = "shell-hook"
description = "100-frame PreExec burst over SOCK_DGRAM"
kind = "latency"
# Per-iter is a 100-frame burst → per-frame ~1µs.
p50_us = 1_000
p99_us = 5_000
fail_at_p99_us = 10_000

[[bsd.gate]]
name = "hook-helper"
description = "shit-helper pkg-event apt pre invocation"
kind = "latency"
p50_us = 20_000
p99_us = 100_000
fail_at_p99_us = 200_000

[[bsd.gate]]
name = "kqueue-drain"
description = "EVFILT_VNODE drain of 64 NOTE_WRITE events"
kind = "throughput"
# Throughput-shaped: ~64 events per iter. Drain must stay below
# these per-iter elapsed times so events/sec stays above the
# headline budget (15k p50, 10k p99).
# 64 events / 4000us = 16k ev/sec
# 64 events / 6400us = 10k ev/sec
# 64 events / 12800us = 5k ev/sec (2x fail floor)
p50_us = 4_000
p99_us = 6_400
fail_at_p99_us = 12_800

[[bsd.gate]]
name = "per-event-capture"
description = "kqueue::capture::read_pre_image on a 64 KiB pre-image"
kind = "latency"
# B07.6: per-event pre-image read. read_pre_image is fundamentally
# a pread(2) loop; on a healthy host it's microseconds (shit-fbsd
# measured ~3µs median at 64KB). Sprint budget targets the full
# "pre-image + SCM_RIGHTS upload" pair; our bench measures only
# the read, so we sit far under. Budget kept at sprint-spec
# values to catch catastrophic regressions (e.g. accidental
# sync flush, blocking copy).
p50_us = 5_000
p99_us = 25_000
fail_at_p99_us = 50_000

# =====================================================================
# LSM tier (AU13 — perf-lsm.yml on the AR00 self-hosted runner; LSM=bpf)
# =====================================================================

[[lsm.gate]]
name = "lsm-program-load"
description = "BPF program load + attach latency for one LSM hook"
kind = "latency"
# BPF verifier + JIT + LSM attach. Sprint target: p50<50ms,
# p99<200ms, fail at 500ms. Cold-cache; warm-up discards first 3.
p50_us = 50_000
p99_us = 200_000
fail_at_p99_us = 500_000

[[lsm.gate]]
name = "lsm-ringbuf-drain"
description = "userspace ringbuf consumer drain of 64 synthetic events"
kind = "throughput"
# Throughput-shaped: 64 events per iter, target 10k ev/sec p50.
# 64 / 6400us  = 10k ev/sec (p50 budget)
# 64 / 12800us = 5k ev/sec  (p99 budget)
# 64 / 32000us = 2k ev/sec  (fail floor)
p50_us = 6_400
p99_us = 12_800
fail_at_p99_us = 32_000

[[lsm.gate]]
name = "lsm-event-capture"
description = "end-to-end rm under LSM tier → CapturedPreImage in journal"
kind = "latency"
# Sprint target: p50<5ms, p99<20ms, fail at 50ms. This is the
# user-visible latency that determines whether shit is "noticeable"
# on the LSM path. Bench drives a real shitd + LSM tier + WatchTree
# + rm and measures rm → journaled CapturedPreImage round-trip.
p50_us = 5_000
p99_us = 20_000
fail_at_p99_us = 50_000
