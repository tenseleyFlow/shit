        uses: actions/upload-artifact@v4
        with:
          name: apt-pkg-smoke-logs
          path: |
            /tmp/shit-smoke.*/shitd.log
            /tmp/shit-smoke.*/state/shit/log/

  refuse-without-native-delegate:
    # AR02.5 -- validates the synthesis-fallback branch of the
    # native-undo-delegation contract: on apt < 3.2 (no native
    # history-rollback verb), shit undo must apply the synthesized
    # apt-get remove cleanly, not refuse. ubuntu-24.04 ships
    # apt 2.7 so the synthesis path is structurally certain here.
    name: refuse-without-native-delegate smoke (AR02.5)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: install sqlite + python3
        run: sudo apt-get update && sudo apt-get install -y sqlite3 python3
      - name: build binaries
        run: cargo build --release -p shitd -p shit -p shit-helper
      - name: run smoke
        run: bash tests/smoke/refuse-without-native-delegate.sh
      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: refuse-without-native-delegate-logs
          path: |
            /tmp/shit-smoke.*/shitd.log
            /tmp/shit-smoke.*/state/shit/log/

  apt-history-rollback:
    # AR02.1 -- validates the native-delegation branch of the
    # native-undo contract: on apt >= 3.2, shit undo dispatches to
    # `apt-get history-rollback <tx_id>` instead of synthesizing
    # apt-get remove. Skips cleanly on apt < 3.2 (the AR02.5 leg's
    # territory). Mutually-exclusive with AR02.5 by apt-version gate;
    # both should run so whichever leg matches the runner activates.
    #
    # Current AR00 runner is ubuntu-24.04 / apt 2.8 so this smoke
    # always skips today. Written now so it activates automatically
    # when AR00 gains a debian:trixie or ubuntu:26.04 leg.
    name: apt-history-rollback smoke (AR02.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: install sqlite + python3
        run: sudo apt-get update && sudo apt-get install -y sqlite3 python3
      - name: build binaries
        run: cargo build --release -p shitd -p shit -p shit-helper
      - name: run smoke
        run: bash tests/smoke/apt-history-rollback-linux.sh
      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apt-history-rollback-logs
          path: |
            /tmp/shit-smoke.*/shitd.log
            /tmp/shit-smoke.*/state/shit/log/

  dnf-history-undo:
    # AR02.2 -- validates the dnf native-delegation path: on a Fedora
    # system, shit undo dispatches to `dnf history undo <id>` instead
    # of synthesizing `dnf remove`. Skips cleanly on non-dnf systems
    # (current AR00 runner is Debian-family). AR10.7 tracks adding a
    # Fedora runner leg.
    #
    # Unlike apt-history-rollback (which has the AR02.5 synthesis
    # counterpart on the same Debian-family runner), AR02.2 has no
    # synthesis counterpart -- dnf has always had its history verb,
    # so the runner choice is binary: dnf present (delegation runs)
    # or absent (skip entirely).
    name: dnf-history-undo smoke (AR02.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: install sqlite + python3
        run: sudo apt-get update && sudo apt-get install -y sqlite3 python3
      - name: build binaries
        run: cargo build --release -p shitd -p shit -p shit-helper
      - name: run smoke
        run: bash tests/smoke/dnf-history-undo-linux.sh
      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dnf-history-undo-logs
          path: |
            /tmp/shit-smoke.*/shitd.log
            /tmp/shit-smoke.*/state/shit/log/

  docker-rmi-undo:
    # AR03.2 -- validates the container-runtime capture pipeline
    # (DR-CR-26, AR03 PR-B). `docker rmi <image>` ships the tarball
    # inline via the docker-wrapper hook → shit-helper container-event
    # → shitd ctl → BlobStore + container_stashes; `shit undo` restores
    # via `docker load`. Inline-bytes fast path is sized for alpine
    # (~5 MB); large-image shipping is AR10.8.
    #
    # ubuntu-24.04 hosted runners ship docker preinstalled; no extra
    # setup beyond sqlite + python3.
    name: docker-rmi-undo smoke (AR03.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: install sqlite + python3
        run: sudo apt-get update && sudo apt-get install -y sqlite3 python3
      - name: docker preflight
        run: |
          docker version
          docker info --format '{{.ServerVersion}}'
      - name: build binaries
        run: cargo build --release -p shitd -p shit -p shit-helper
      - name: run smoke
        run: bash tests/smoke/docker-rmi-undo-linux.sh
      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-rmi-undo-logs
          path: |
            /tmp/shit-smoke.*/shitd.log
            /tmp/shit-smoke.*/state/shit/log/

  docker-volume-rm-undo:
    # AR03.3 -- validates the container-runtime VolumeRm capture +
    # restore path. `docker volume rm <vol>` ships a gzipped tarball
    # of the volume's contents (`docker run --rm -v vol:/src:ro
    # busybox tar -czf -`) inline via the AR03.2 large-frame plumbing;
    # `shit undo` recreates the volume and pipes the tarball back via
    # `docker run --rm -i ... tar -xzf -`. Asserts byte-identity of a
    # probe file pre- and post-undo.
    name: docker-volume-rm-undo smoke (AR03.3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: install sqlite + python3
        run: sudo apt-get update && sudo apt-get install -y sqlite3 python3
      - name: docker preflight
        run: |
          docker version
          docker info --format '{{.ServerVersion}}'
      - name: build binaries
        run: cargo build --release -p shitd -p shit -p shit-helper
      - name: run smoke
        run: bash tests/smoke/docker-volume-rm-undo-linux.sh
      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-volume-rm-undo-logs
          path: |
            /tmp/shit-smoke.*/shitd.log
            /tmp/shit-smoke.*/state/shit/log/

  systemctl-svc:
    name: systemctl-svc smoke (DR-34)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: install sqlite + python3
        run: sudo apt-get update && sudo apt-get install -y sqlite3 python3
      - name: enable user systemd manager
        # GH runners ship with systemd but the user manager isn't
        # active out of the box. enable-linger keeps it up between
        # logins so `systemctl --user` works in non-interactive jobs.
        run: |
          sudo loginctl enable-linger "$(id -un)" || true
          systemctl --user status --no-pager || true
      - name: build binaries
        run: cargo build --release -p shitd -p shit -p shit-helper
      - name: run smoke
        run: bash tests/smoke/systemctl-svc.sh
      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: systemctl-svc-smoke-logs
          path: |
            /tmp/shit-smoke.*/shitd.log
            /tmp/shit-smoke.*/state/shit/log/

  nft-net:
