          path: |
            /tmp/shit-smoke.*/shitd.log
            /tmp/shit-smoke.*/state/shit/log/

  brew-pkg:
    name: brew-pkg smoke (DR-22)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: build binaries
        run: cargo build --release -p shitd -p shit -p shit-helper
      - name: run smoke
        run: bash tests/smoke/brew-pkg.sh
      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: brew-pkg-smoke-logs
          path: |
            /tmp/shit-smoke.*/shitd.log
            /tmp/shit-smoke.*/state/shit/log/

  apt-pkg:
    name: apt-pkg smoke (DR-19)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: install sqlite + python3
        run: sudo apt-get update && sudo apt-get install -y sqlite3 python3
      - name: build binaries
        run: cargo build --release -p shitd -p shit -p shit-helper
      - name: run smoke
        run: bash tests/smoke/apt-pkg.sh
      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apt-pkg-smoke-logs
          path: |
            /tmp/shit-smoke.*/shitd.log
            /tmp/shit-smoke.*/state/shit/log/

  systemctl-svc:
    name: systemctl-svc smoke (DR-34)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: install sqlite + python3
        run: sudo apt-get update && sudo apt-get install -y sqlite3 python3
      - name: enable user systemd manager
        # GH runners ship with systemd but the user manager isn't
        # active out of the box. enable-linger keeps it up between
        # logins so `systemctl --user` works in non-interactive jobs.
        run: |
          sudo loginctl enable-linger "$(id -un)" || true
          systemctl --user status --no-pager || true
      - name: build binaries
        run: cargo build --release -p shitd -p shit -p shit-helper
      - name: run smoke
        run: bash tests/smoke/systemctl-svc.sh
      - name: upload artifacts on failure
