    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: install sqlite + python3
        run: sudo apt-get update && sudo apt-get install -y sqlite3 python3
      - name: build binaries
        run: cargo build --release -p shitd -p shit -p shit-helper
      - name: run smoke
        run: bash tests/smoke/kill-proc.sh
      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kill-proc-smoke-logs
          path: |
            /tmp/shit-smoke.*/shitd.log
            /tmp/shit-smoke.*/state/shit/log/

  sqlite3-db:
    name: sqlite3-db smoke (DR-58)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: install sqlite + python3
        run: sudo apt-get update && sudo apt-get install -y sqlite3 python3
      - name: build binaries
        run: cargo build --release -p shitd -p shit -p shit-helper
      - name: run smoke
        run: bash tests/smoke/sqlite3-db.sh
      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite3-db-smoke-logs
          path: |
            /tmp/shit-smoke.*/shitd.log
            /tmp/shit-smoke.*/state/shit/log/

  sqlite3-db-macos:
    name: sqlite3-db smoke (macOS)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: build binaries
        run: cargo build --release -p shitd -p shit -p shit-helper
      - name: run smoke
        run: bash tests/smoke/sqlite3-db.sh
      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite3-db-smoke-macos-logs
          path: |
            /tmp/shit-smoke.*/shitd.log
            /tmp/shit-smoke.*/state/shit/log/

  # B04 — FreeBSD smoke regression net. Runs all 9 BSD smokes inside
  # a FreeBSD-14 VM. Single VM, many smokes (job-per-smoke would cost
  # ~10 minutes per smoke in VM boot alone). One unit covers:
  #   - file tier: rm-undo / mkdir-undo / chmod-undo / touch-edit-undo
  #   - package tier: pkg-install-undo (via doas)
  #   - service tier: service-restart-undo (cron via doas)
  #   - network tier: pfctl-add-undo / pfctl-flush-undo (pf via doas)
  #   - process tier: kill-proc-undo (pkill -f resolved by sysctl(KERN_PROC_*))
  #
  # Doctor JSON pre-flight gates the smoke run — if the CI image's
  # FreeBSD lacks a working kqueue we skip cleanly and fail the job
  # loudly rather than running smokes against a degraded kernel.
  #
  # Release-gating: this job must be green before tagging a release.
  freebsd-smoke:
    name: freebsd-smoke (B04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: BSD smoke matrix inside FreeBSD 14
        # v0.30.0 is what ci.yml's freebsd-14 job uses (image + the
        # GHSA-928q-63gf-mc2x fix). Keep pinned; don't follow @v0.
        uses: cross-platform-actions/action@v0.30.0
        with:
          operating_system: freebsd
          version: '14.2'
          shell: sh
          # The CI VM's default user is `runner` and is in `wheel`.
          # `sudo` is wired by the action; `doas` we install ourselves
          # because the smokes prefer it.
          run: |
            set -eu
            echo "===== install deps ====="
            sudo pkg install -y rust gmake python3 sqlite3 doas jq

            echo "===== configure doas (permit the CI runner user directly) ====="
            # The cross-platform-actions VM runs commands as a user
            # that's NOT in `wheel`, so `permit nopass :wheel` doesn't
            # apply. Grant the current user explicitly.
            CI_USER="$(id -un)"
            echo "  user: ${CI_USER}"
            printf 'permit nopass %s\npermit nopass :wheel\n' "${CI_USER}" \
              | sudo tee /usr/local/etc/doas.conf >/dev/null
            sudo chmod 0640 /usr/local/etc/doas.conf
            # Verify doas actually works before continuing.
            doas /sbin/sysctl -n kern.ostype || {
              echo "FAIL: doas misconfigured; cat /usr/local/etc/doas.conf:"
              sudo cat /usr/local/etc/doas.conf
              exit 1
            }

            echo "===== build release binaries ====="
            cargo build --release \
                -p shit -p shitd -p shit-helper -p shit-preload-shim \
                --locked 2>&1 | tail -10

            echo "===== load pf with permissive baseline ====="
            # pf isn't loaded by default in the CI image. Load it
            # with `pass all` so SSH (which the action's runtime
            # depends on) stays alive and the pfctl smokes have
            # /dev/pf bound. The smokes already SKIP cleanly without
            # this; the kldload makes them run instead of skip.
            sudo kldload pf || echo "  pf already loaded"
            echo 'pass all' | sudo tee /etc/pf.conf >/dev/null
            sudo /usr/sbin/service pf onestart || true
            ls -la /dev/pf 2>&1 || echo "WARN: /dev/pf still absent; pf smokes will SKIP"

            echo "===== doctor JSON pre-flight ====="
            export SHIT_HELPER_BIN="$(pwd)/target/release/shit-helper"
            ./target/release/shit doctor --json > /tmp/doctor.json
            # Gate: kqueue must be functional. If not, the CI image's
            # FreeBSD kernel is unusable for our purposes — fail loud.
            if ! jq -e '.bsd.kqueue_functional == true' /tmp/doctor.json >/dev/null; then
              echo "FAIL: doctor reports kqueue not functional in this VM image"
              jq '.bsd' /tmp/doctor.json
              exit 1
            fi
            echo "  doctor kqueue_functional: PASS"
            jq -r '.bsd | "  capsicum: \(.capsicum_available)  zfs_datasets: \(.zfs_datasets|length)  runtime_capture: \(.runtime_capture)"' /tmp/doctor.json

            echo "===== run smokes ====="
            FAIL_COUNT=0
            SMOKES="rm-undo-fbsd.sh \
                    mkdir-undo-fbsd.sh \
                    chmod-undo-fbsd.sh \
                    touch-edit-undo-fbsd.sh \
                    pkg-install-undo-fbsd.sh \
                    service-restart-undo-fbsd.sh \
                    pfctl-add-undo-fbsd.sh \
                    pfctl-flush-undo-fbsd.sh \
                    kill-proc-undo-fbsd.sh"
            for smoke in $SMOKES; do
              echo "----- $smoke -----"
              # `timeout(1)` is in GNU coreutils which we didn't
              # install; FreeBSD has /usr/bin/timeout via base. Each
              # smoke gets 5 min.
              if /usr/bin/timeout 300 bash "tests/smoke/$smoke"; then
                echo "  PASS: $smoke"
              else
                echo "  FAIL: $smoke"
                FAIL_COUNT=$((FAIL_COUNT + 1))
              fi
            done

            if [ "$FAIL_COUNT" -gt 0 ]; then
              echo "===== $FAIL_COUNT smoke(s) failed ====="
              exit 1
            fi
            echo "===== all 9 BSD smokes green ====="
      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-smoke-logs
          path: |
            /tmp/shit-smoke.*/shitd.log
            /tmp/shit-smoke.*/state/shit/log/
            /tmp/doctor.json
