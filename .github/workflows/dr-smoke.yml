name: DR smoke matrix

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

# Each job builds the release binaries and runs one smoke script
# against them. Independent jobs so a failure isolates to its tier.

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke-discovery:
    # AU14-B — gating smoke-discovery surface. Three checks, in order:
    #   1. verify  — every smoke has valid SMOKE_* metadata
    #   2. verify-coverage — every runnable smoke is referenced by some
    #      job in dr-smoke.yml (standalone job OR bucket consumer)
    #   3. matrix summary + artifact upload
    # The linux-kernel-capture + freebsd-smoke jobs now consume the
    # driver's bucket subcommand directly, so adding a new smoke without
    # wiring it into either a bucket-eligible runner or a standalone job
    # fails this gate loud.
    name: smoke discovery + verify (AU14)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: verify metadata headers
        run: bash tools/audit/smoke-driver.sh verify
      - name: verify CI coverage
        run: bash tools/audit/smoke-driver.sh verify-coverage
      - name: verify no soft-asserts in smokes (AU06)
        # AU06 — every smoke either asserts hard or carves the gap to
        # a tracked sprint via SMOKE header `EXCLUDED_BY:` (AU14-A's
        # verify step enforces that EXCLUDED_BY pairs with
        # EXCLUDED_REASON). The two banned legacy patterns:
        #   - literal "soft-assert"
        #   - "[FOO-pending]" tag inside smoke_log calls
        # If you hit this gate, tighten the assertion to `smoke_fail`
        # OR add `EXCLUDED_BY:` / `EXCLUDED_REASON:` headers pointing
        # at the sprint that closes the gap. See AU06 spec for the
        # decision matrix.
        run: |
          set +e
          hits="$(grep -rnE 'soft-assert|\[[A-Z0-9.]+-pending\]' tests/smoke/*.sh 2>/dev/null)"
          if [ -n "$hits" ]; then
            echo "::error::AU06 soft-assert gate: forbidden patterns found in tests/smoke/"
            echo "$hits"
            echo ""
            echo "Tighten to smoke_fail or carve with EXCLUDED_BY: <sprint-id> + EXCLUDED_REASON: <one-liner>"
            exit 1
          fi
          echo "AU06 soft-assert gate: clean (0 hits)"
      - name: emit smoke-matrix.json
        run: |
          bash tools/audit/smoke-driver.sh discover > smoke-matrix.json
          echo "===== matrix summary ====="
          python3 -c "
          import json
          data = json.load(open('smoke-matrix.json'))
          from collections import Counter
          print(f'total: {len(data)}')
          print(f'runnable: {sum(1 for r in data if not r[\"excluded_by\"])}')
          print(f'excluded: {sum(1 for r in data if r[\"excluded_by\"])}')
          for r in data:
              if r['excluded_by']:
                  print(f'  EXCLUDED: {r[\"name\"]} (by {r[\"excluded_by\"]}): {r[\"excluded_reason\"]}')
          print('by runner:', dict(Counter(r['runner'] for r in data)))
          print('by platform:', dict(Counter(r['platform'] for r in data)))
          print('by tier:', dict(Counter(r['tier'] for r in data)))
          "
      - name: upload smoke-matrix.json
        uses: actions/upload-artifact@v4
        with:
          name: smoke-matrix
          path: smoke-matrix.json

  stamp-coverage-snapshot:
    # AU02 — emit a candidate coverage-snapshot.json as a build artifact
    # on every CI run. On green trunk, the next release commits this
    # artifact into tools/audit/coverage-snapshot.json (manual
    # release-time step per AU02 user choice — no auto-commit noise).
    #
    # The snapshot includes: commit sha, workflow run URL, generated_at
    # timestamp, and the runnable smoke set from AU14's matrix. The
    # third set (refused_classes) comes from the planner refuse catalog
    # at build time and is intentionally NOT in the snapshot — it's
    # always derivable from the embedded code.
    name: stamp coverage snapshot (AU02)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [smoke-discovery]
    steps:
      - uses: actions/checkout@v4
      - name: emit candidate snapshot
        run: |
          bash tools/audit/smoke-driver.sh discover > /tmp/matrix.json
          python3 - <<'PY' > coverage-snapshot.json
          import json, os, subprocess, datetime
          matrix = json.load(open('/tmp/matrix.json'))
          green_smokes = sorted(r['name'] for r in matrix if not r['excluded_by'])
          covered_classes = sorted(set(r['name'] for r in matrix
                                       if not r['excluded_by']
                                       and r['runner'] in ('self-hosted-lsm', 'freebsd-vm')))
          server = os.environ.get('GITHUB_SERVER_URL', 'https://github.com')
          repo   = os.environ.get('GITHUB_REPOSITORY', '')
          rid    = os.environ.get('GITHUB_RUN_ID', '')
          url    = f"{server}/{repo}/actions/runs/{rid}" if rid else ''
          snap = {
              'version': 1,
              'generated_at': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'workflow_run_url': url,
              'commit_sha': os.environ.get('GITHUB_SHA', ''),
              'green_smokes': green_smokes,
              'covered_classes': covered_classes,
              'refused_classes': [],
              'pending_classes': [],
              'comment': 'AU02 CI-generated. Manual release-time commit picks up the latest artifact and overwrites tools/audit/coverage-snapshot.json.'
          }
          print(json.dumps(snap, indent=2))
          PY
          echo "===== candidate snapshot ====="
          cat coverage-snapshot.json
      - name: upload coverage-snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-snapshot
          path: coverage-snapshot.json

  doctor-coverage-honest:
    # AU02 — assert `shit doctor --json` carries the honest coverage
    # envelope (schema v2, no coverage_pct, count fields populated,
    # binary_built_at non-empty, last_validated_at matches the
    # embedded coverage-snapshot.json).
    name: doctor coverage envelope (AU02)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: install python3
        run: sudo apt-get update && sudo apt-get install -y python3
      - name: build shit
        run: cargo build --release -p shit
      - name: run smoke
        run: bash tests/smoke/doctor-coverage-honest.sh

  daemon-boot:
    name: daemon-boot smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
