    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: install nft + sqlite + python3
        run: sudo apt-get update && sudo apt-get install -y nftables sqlite3 python3
      - name: build binaries
