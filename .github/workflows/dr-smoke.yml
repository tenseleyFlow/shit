            /tmp/shit-smoke.*/state/shit/log/

  sqlite3-db-macos:
    name: sqlite3-db smoke (macOS)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: build binaries
