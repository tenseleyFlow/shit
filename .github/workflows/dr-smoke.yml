    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: install sqlite + python3
        run: sudo apt-get update && sudo apt-get install -y sqlite3 python3
      - name: build binaries
        run: cargo build --release -p shitd -p shit -p shit-helper
      - name: run smoke
        run: bash tests/smoke/kill-proc.sh
      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kill-proc-smoke-logs
          path: |
            /tmp/shit-smoke.*/shitd.log
            /tmp/shit-smoke.*/state/shit/log/

  sqlite3-db:
    name: sqlite3-db smoke (DR-58)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: install sqlite + python3
        run: sudo apt-get update && sudo apt-get install -y sqlite3 python3
      - name: build binaries
        run: cargo build --release -p shitd -p shit -p shit-helper
      - name: run smoke
        run: bash tests/smoke/sqlite3-db.sh
      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite3-db-smoke-logs
          path: |
            /tmp/shit-smoke.*/shitd.log
            /tmp/shit-smoke.*/state/shit/log/

  sqlite3-db-macos:
    name: sqlite3-db smoke (macOS)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: build binaries
        run: cargo build --release -p shitd -p shit -p shit-helper
      - name: run smoke
        run: bash tests/smoke/sqlite3-db.sh
      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite3-db-smoke-macos-logs
          path: |
            /tmp/shit-smoke.*/shitd.log
            /tmp/shit-smoke.*/state/shit/log/

  # L07 — Linux kernel-capture matrix. Exercises L02 (rm/edit),
  # L03 (chmod/mkdir/touch-edit deferred), L04 (eBPF-LSM tier),
  # and L04.1 (file_open + rename) end-to-end on the runner's
  # kernel. Pre-flight gates on `shit doctor --json` so a busted
  # runner image (missing caps, missing LSM=bpf) fails fast with
  # the operator-readable remediation rather than a timeout.
  #
  # Single job, serial smokes — total runtime ~3-5 min, no
  # parallel-job overhead. Per-smoke timeout 5 min so a hang
  # surfaces as a labeled failure instead of consuming the whole
  # 30-min job budget.
  linux-kernel-capture:
    name: linux-kernel-capture (L02/L03/L04 smoke matrix)
    # Self-hosted DO runner provisioned in AR00 with `bpf` in the
    # active LSMs (stock `ubuntu-24.04` runners boot without it,
    # which forces L04 to degrade to fanotify-perm and the five
    # LSM-pinned smokes to refuse). Snapshot ID, registration, and
    # refresh cadence: see .docs/audits/ar00-runner-ops.md.
    runs-on: [self-hosted, linux-kernel-capture]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml at the workspace root pins 1.88; the
      # snapshot has rustup 1.88 installed for the runner user.
      # The /usr/local/bin/cargo symlink points into /root/.cargo/bin
      # which the runner can't traverse (mode 700 on /root), so we
      # prepend /home/runner/.cargo/bin to GITHUB_PATH for this job.
      # The next snapshot rebuild (AR00.1 refresh) should install
      # rustup to /opt/cargo with /opt/cargo/bin on /etc/environment's
      # PATH so this prepend becomes unnecessary; tracked as an
      # AR00 follow-up in .docs/audits/ar00-runner-ops.md.
      - name: put runner-user cargo on PATH
        run: echo "/home/runner/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      - name: install system deps (idempotent on snapshot)
        run: |
          # Snapshot has jq / python3 / sqlite3 / libcap2-bin already.
          # apt-get install is a no-op cost when packages are present.
          sudo apt-get install -y --no-install-recommends \
            jq python3 sqlite3 libcap2-bin

      - name: build release binaries
        run: |
          cargo build --release \
            -p shit -p shitd -p shit-helper

      - name: setcap helper
        run: |
          sudo setcap cap_sys_admin,cap_bpf,cap_perfmon+ep \
            target/release/shit-helper
          getcap target/release/shit-helper

      - name: kernel + LSM diagnostics
        run: |
          uname -a
          cat /sys/kernel/security/lsm || echo "lsm file missing"
          ls -la /sys/kernel/btf/vmlinux || echo "BTF missing"

      - name: doctor pre-flight (JSON)
        env:
          SHIT_HELPER_BIN: ${{ github.workspace }}/target/release/shit-helper
        run: |
          ./target/release/shit doctor --json > /tmp/doctor.json
          cat /tmp/doctor.json | jq '.linux'
          # Gate: tier must be ebpf-lsm OR fanotify-perm (not degraded).
          jq -e '.linux.runtime_capture == "ebpf-lsm"
              or .linux.runtime_capture == "fanotify-perm"' /tmp/doctor.json
          # Helper caps must be present on the binary.
          jq -e '.linux.capabilities.helper_binary.cap_sys_admin == true
              and .linux.capabilities.helper_binary.cap_bpf == true
              and .linux.capabilities.helper_binary.cap_perfmon == true' /tmp/doctor.json

      - name: which tier did doctor pick
        id: tier
        env:
          SHIT_HELPER_BIN: ${{ github.workspace }}/target/release/shit-helper
        run: |
          TIER=$(jq -r '.linux.runtime_capture' /tmp/doctor.json)
          echo "tier=${TIER}" >> "$GITHUB_OUTPUT"
          echo "Doctor picked tier: ${TIER}"

      - name: run kernel-capture smokes
        env:
          SHIT_HELPER_BIN: ${{ github.workspace }}/target/release/shit-helper
          SHIT_SMOKE_BIN_DIR: ${{ github.workspace }}/target/release
        run: |
          set +e
          TIER="${{ steps.tier.outputs.tier }}"
          # Two smoke groups by tier-dependency:
          #
          # - LSM-required: rm/chmod/mkdir/mv/touch-edit. These hard-
          #   require `bpf` in /sys/kernel/security/lsm and pin
          #   SHIT_FORCE_TIER=ebpf-lsm internally. They cannot run on
          #   a kernel whose boot cmdline omits `lsm=...,bpf,...` —
          #   their own pre-flight rejects loudly with a remediation
          #   message. Ubuntu 24.04's stock cmdline omits bpf so on
          #   the GHA hosted runner this group is skipped.
          #
          # - Tier-agnostic: edit-undo. Overwrite-of-existing-file
          #   capture works under either tier (fanotify-perm's
          #   FAN_OPEN_PERM or LSM's file_open hook).
          TIER_AGNOSTIC=( edit-undo-linux.sh )
          LSM_SMOKES=(
            rm-undo-linux.sh
            chmod-undo-linux.sh
            mkdir-undo-linux.sh
            mv-undo-linux.sh
            touch-edit-undo-linux.sh
          )
          if [ "$TIER" = "ebpf-lsm" ]; then
            export SHIT_FORCE_TIER=ebpf-lsm
            RUN=( "${TIER_AGNOSTIC[@]}" "${LSM_SMOKES[@]}" )
            echo "Runner has ebpf-lsm functional; running full smoke matrix"
          else
            RUN=( "${TIER_AGNOSTIC[@]}" )
            echo "Runner picks tier=${TIER}; skipping LSM-only smokes (need lsm=bpf in cmdline)"
          fi
          FAIL=0
          for s in "${RUN[@]}"; do
            echo ""
            echo "===== ${s} ====="
            timeout 300 bash "tests/smoke/${s}"
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "PASS: ${s}"
            else
              echo "FAIL: ${s} (rc=${rc})"
              FAIL=$((FAIL + 1))
            fi
          done
          if [ "$FAIL" -gt 0 ]; then
            echo ""
            echo "${FAIL} smoke(s) failed"
            exit 1
          fi
          echo "All Linux kernel-capture smokes green (ran ${#RUN[@]} smokes)"

      - name: doctor post-check (diagnostic only)
        if: always()
        env:
          SHIT_HELPER_BIN: ${{ github.workspace }}/target/release/shit-helper
        run: ./target/release/shit doctor --json | jq '.' || true

      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-kernel-capture-logs
          path: |
            /tmp/doctor.json
            /tmp/shit-smoke.*/shitd.log
            /tmp/shit-smoke.*/state/shit/log/

  # B04+B05 — FreeBSD smoke regression net. Runs all 10 BSD smokes
  # inside a FreeBSD-14 VM. Single VM, many smokes (job-per-smoke
  # would cost ~10 minutes per smoke in VM boot alone). One unit
  # covers:
  #   - file tier: rm-undo / mkdir-undo / chmod-undo / touch-edit-undo
  #   - package tier: pkg-install-undo (via doas)
  #   - service tier: service-restart-undo (cron via doas)
  #   - network tier: pfctl-add-undo / pfctl-flush-undo (pf via doas)
  #   - process tier: kill-proc-undo (pkill -f resolved by sysctl(KERN_PROC_*))
  #   - sandbox: capsicum-default-on (B05: helper enters cap_enter, full
  #     rm-undo pipeline works inside the capability sandbox)
  #
  # Doctor JSON pre-flight gates the smoke run — if the CI image's
  # FreeBSD lacks a working kqueue we skip cleanly and fail the job
  # loudly rather than running smokes against a degraded kernel.
  #
  # Release-gating: this job must be green before tagging a release.
  freebsd-smoke:
    name: freebsd-smoke (B04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: BSD smoke matrix inside FreeBSD 14
        # v0.30.0 is what ci.yml's freebsd-14 job uses (image + the
        # GHSA-928q-63gf-mc2x fix). Keep pinned; don't follow @v0.
        uses: cross-platform-actions/action@v0.30.0
        with:
          operating_system: freebsd
          version: '14.2'
          shell: sh
          # The CI VM's default user is `runner` and is in `wheel`.
          # `sudo` is wired by the action; `doas` we install ourselves
          # because the smokes prefer it.
          run: |
            set -eu
            echo "===== install deps ====="
            sudo pkg install -y rust gmake python3 sqlite3 doas jq git vim

            echo "===== configure doas (permit the CI runner user directly) ====="
            # The cross-platform-actions VM runs commands as a user
            # that's NOT in `wheel`, so `permit nopass :wheel` doesn't
            # apply. Grant the current user explicitly.
            CI_USER="$(id -un)"
            echo "  user: ${CI_USER}"
            printf 'permit nopass %s\npermit nopass :wheel\n' "${CI_USER}" \
              | sudo tee /usr/local/etc/doas.conf >/dev/null
            sudo chmod 0640 /usr/local/etc/doas.conf
            # Verify doas actually works before continuing.
            doas /sbin/sysctl -n kern.ostype || {
              echo "FAIL: doas misconfigured; cat /usr/local/etc/doas.conf:"
              sudo cat /usr/local/etc/doas.conf
              exit 1
            }

            echo "===== build release binaries ====="
            cargo build --release \
                -p shit -p shitd -p shit-helper -p shit-preload-shim \
                --locked 2>&1 | tail -10

            echo "===== load pf with permissive baseline ====="
            # pf isn't loaded by default in the CI image. Load it
            # with `pass all` so SSH (which the action's runtime
            # depends on) stays alive and the pfctl smokes have
            # /dev/pf bound. The smokes already SKIP cleanly without
            # this; the kldload makes them run instead of skip.
            sudo kldload pf || echo "  pf already loaded"
            echo 'pass all' | sudo tee /etc/pf.conf >/dev/null
            sudo /usr/sbin/service pf onestart || true
            ls -la /dev/pf 2>&1 || echo "WARN: /dev/pf still absent; pf smokes will SKIP"

            echo "===== doctor JSON pre-flight ====="
            export SHIT_HELPER_BIN="$(pwd)/target/release/shit-helper"
            ./target/release/shit doctor --json > /tmp/doctor.json
            # Gate: kqueue must be functional. If not, the CI image's
            # FreeBSD kernel is unusable for our purposes — fail loud.
            if ! jq -e '.bsd.kqueue_functional == true' /tmp/doctor.json >/dev/null; then
              echo "FAIL: doctor reports kqueue not functional in this VM image"
              jq '.bsd' /tmp/doctor.json
              exit 1
            fi
            echo "  doctor kqueue_functional: PASS"
            jq -r '.bsd | "  capsicum: \(.capsicum_available)  zfs_datasets: \(.zfs_datasets|length)  runtime_capture: \(.runtime_capture)"' /tmp/doctor.json

            echo "===== environment diagnostics ====="
            echo "  bash: $(bash --version | head -1)"
            echo "  uname: $(uname -srm)"
            echo "  timeout: $(/usr/bin/timeout --version 2>&1 | head -1 || /usr/bin/timeout 2>&1 | head -1 || true)"

            echo "===== run smokes ====="
            FAIL_COUNT=0
            SMOKES="rm-undo-fbsd.sh \
                    mkdir-undo-fbsd.sh \
                    chmod-undo-fbsd.sh \
                    touch-edit-undo-fbsd.sh \
                    pkg-install-undo-fbsd.sh \
                    service-restart-undo-fbsd.sh \
                    pfctl-add-undo-fbsd.sh \
                    pfctl-flush-undo-fbsd.sh \
                    kill-proc-undo-fbsd.sh \
                    capsicum-default-on-fbsd.sh \
                    git-commit-undo-fbsd.sh \
                    vim-edit-undo-fbsd.sh"
            for smoke in $SMOKES; do
              echo "----- $smoke -----"
              # Capture timeout's exit code separately so we can
              # distinguish: 0=success, 124=timeout(1)-killed,
              # 137=SIGKILL'd, other=smoke explicitly exited.
              # Don't use `if timeout ...; then` — that loses the
              # exit code distinction.
              #
              # lib.sh's smoke_cleanup arms a safety-net `setsid sh
              # -c 'sleep 10; kill -KILL $$'` before its `exit $rc`.
              # If bash's exit() hangs (FBSD CI quirk where service-
              # restart pins bash via fd inheritance we haven't
              # isolated yet), the safety-net SIGKILLs bash so the
              # job doesn't hang the runner. Exit code in that case
              # is 137 (SIGKILL) — but the smoke had already logged
              # its PASS line BEFORE arming the safety-net. So we
              # treat 137 + "PASS:" in stdout as success.
              passlog="$(mktemp /tmp/smoke-out.XXXXXX)"
              rc_file="$(mktemp /tmp/smoke-rc.XXXXXX)"
              # Sh-portable live output + rc capture: subshell writes
              # rc to a sidecar file; outer pipe streams to tee for
              # live visibility. The subshell's own exit code (from
              # `echo`) is always 0, which we discard.
              set +e
              (
                /usr/bin/timeout --signal=TERM --kill-after=10 300 \
                  bash "tests/smoke/$smoke"
                echo $? > "$rc_file"
              ) 2>&1 | tee "$passlog"
              set -e
              rc=$(cat "$rc_file" 2>/dev/null || echo 1)
              rm -f "$rc_file"
              case "$rc" in
                0)    echo "  PASS: $smoke" ;;
                124)  echo "  FAIL: $smoke (timeout(1) killed bash via SIGTERM)";  FAIL_COUNT=$((FAIL_COUNT + 1)) ;;
                137)  if grep -q "^\[smoke .*\] PASS: " "$passlog"; then
                        echo "  PASS: $smoke (safety-net kill — bash hung after smoke logged PASS)"
                      else
                        echo "  FAIL: $smoke (SIGKILL'd without PASS marker)"
                        FAIL_COUNT=$((FAIL_COUNT + 1))
                      fi ;;
                125)  echo "  FAIL: $smoke (timeout(1) error)"; FAIL_COUNT=$((FAIL_COUNT + 1)) ;;
                126)  echo "  FAIL: $smoke (bash not executable)"; FAIL_COUNT=$((FAIL_COUNT + 1)) ;;
                127)  echo "  FAIL: $smoke (bash not found)"; FAIL_COUNT=$((FAIL_COUNT + 1)) ;;
                *)    echo "  FAIL: $smoke (exit code $rc — smoke or bash exited explicitly)"; FAIL_COUNT=$((FAIL_COUNT + 1)) ;;
              esac
              rm -f "$passlog"
              # Dump any safety-net log so we see whether it fired.
              for snlog in /tmp/safety-net.*.log; do
                if [ -f "$snlog" ]; then
                  echo "  --- $snlog ---"
                  sed 's/^/    /' "$snlog"
                  rm -f "$snlog"
                fi
              done
              # Older watchdog.log path — kept for safety.
              if [ -f /tmp/watchdog.log ]; then
                echo "  --- /tmp/watchdog.log ---"
                cat /tmp/watchdog.log | sed 's/^/    /'
                rm -f /tmp/watchdog.log
              fi
            done

            if [ "$FAIL_COUNT" -gt 0 ]; then
              echo "===== $FAIL_COUNT smoke(s) failed ====="
              exit 1
            fi
            echo "===== all 10 BSD smokes green ====="

      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-smoke-logs
          path: |
            /tmp/shit-smoke.*/shitd.log
            /tmp/shit-smoke.*/state/shit/log/
            /tmp/doctor.json
