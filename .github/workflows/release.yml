# SPDX-License-Identifier: AGPL-3.0-or-later
#
# release.yml: build release tarballs for every supported target.
#
# Each build job runs packaging/release-tarball.sh and uploads
# shit-<version>-<target>.tar.zst plus a .sha256. The `release` job
# merges the checksums into SHA256SUMS and creates a DRAFT GitHub
# release, but only on a `v*` tag push. workflow_dispatch builds and
# uploads artifacts and stops there: no tag, no release.
#
# Linux is glibc, built on ubuntu-22.04 (glibc 2.35) so the binaries run on
# Debian 12, Ubuntu 22.04+, Fedora and Arch. musl is out: the helper loads
# eBPF programs and the preload shim is a glibc-versioned cdylib.
#
# macOS stays an ad-hoc (dry-run) codesign until Apple grants the
# EndpointSecurity entitlement, so the target is named `-unentitled`.
# Drop the suffix when `--mode=real` lands.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            base="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
            VERSION="${base}-dev.${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "release version: ${VERSION}"

  linux:
    name: linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { arch: arm64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - name: tarball
        run: packaging/release-tarball.sh "${{ needs.version.outputs.version }}" "${{ matrix.target }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: shit-${{ matrix.target }}
          path: dist/*

  freebsd:
    name: freebsd-14 x86_64
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: build on FreeBSD 14
        uses: cross-platform-actions/action@v1.7.0
        with:
          operating_system: freebsd
          version: '14.2'
          shell: sh
          environment_variables: SHIT_VERSION
          run: |
            sudo pkg install -y gmake curl ca_root_nss zstd
            fetch -o /tmp/rustup-init.sh https://sh.rustup.rs
            sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain 1.88
            . "$HOME/.cargo/env"
            cargo build --release --workspace
            packaging/release-tarball.sh "$SHIT_VERSION" x86_64-unknown-freebsd dist
        env:
          SHIT_VERSION: ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: shit-x86_64-unknown-freebsd
          path: dist/*

  macos:
    name: macos arm64
    needs: version
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - name: stamp Info.plist with the build version
        run: |
          INFO=packaging/codesign/macos-info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ needs.version.outputs.version }}" "${INFO}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ needs.version.outputs.version }}" "${INFO}"
      - name: codesign (dry-run; Apple entitlement paperwork pending)
        run: bash packaging/codesign/sign-and-notarize.sh --mode=dry-run --bin target/release/shit-helper
      - name: tarball
        run: |
          command -v zstd >/dev/null || brew install zstd
          packaging/release-tarball.sh "${{ needs.version.outputs.version }}" aarch64-apple-darwin-unentitled dist
      - uses: actions/upload-artifact@v4
        with:
          name: shit-aarch64-apple-darwin-unentitled
          path: dist/*

  release:
    name: draft release
    needs: [version, linux, freebsd, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd dist
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          rm ./*.sha256
          sha256sum -c SHA256SUMS
      - name: create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --draft \
            --title "${GITHUB_REF_NAME}" \
            --prerelease="$(case "${GITHUB_REF_NAME}" in *-*) echo true;; *) echo false;; esac)" \
            --notes "Draft. macOS arm64 is the un-entitled FSEvents + DYLD build; see docs/install-macos.md."
