# FreeBSD pkg(8) event-pipe config.
#
# Drop into /usr/local/etc/pkg/repos/ or as part of /usr/local/etc/pkg.conf;
# pkg reads `EVENT_PIPE` and writes JSON-Lines events to it.
#
# We don't actually use a named-pipe here — we use a wrapper script
# that pkg invokes per-event, then *that* dispatches the pre/post
# call to shit-helper. The wrapper path is fixed at install time by
# `shit service install`.
#
# The `pkg(8)` event model fires events for:
#   - INSTALL_BEGIN / INSTALL_FINISHED
#   - DEINSTALL_BEGIN / DEINSTALL_FINISHED
#   - UPGRADE_BEGIN / UPGRADE_FINISHED
#
# Our wrapper maps `*_BEGIN` -> Pre and `*_FINISHED` -> Post.
#
# SPDX-License-Identifier: AGPL-3.0-or-later

EVENT_PIPE: "/usr/local/libexec/shit/pkg-event-pipe.sh"
