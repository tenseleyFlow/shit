[package]
name = "shit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "shit"
path = "src/main.rs"

[build-dependencies]
vergen-gitcl = { workspace = true }

[dependencies]
shit-proto = { workspace = true }
shit-shell = { workspace = true }
shit-capture = { workspace = true }
shit-planner = { workspace = true }
shit-preload-shim = { workspace = true }
shit-desc = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
libc = { workspace = true }
# AU12.A — `goblin` for ELF + Mach-O header parsing (detecting
# static binaries). Minimal feature set: parse-only for the two
# formats the visibility module cares about. `archive`, `pe`, and
# the rest of goblin's surface stay disabled.
goblin = { version = "0.10", default-features = false, features = ["elf32", "elf64", "mach32", "mach64", "endian_fd", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
# CoreFoundation runloop + string + array types for the macOS FSEvents
# functional probe in `doctor::probes::macos`. Matches the helper
# crate's macOS deps (M01.2); the doctor needs an in-process probe
# that doesn't require the helper-side ES entitlement.
core-foundation = "0.10"
core-foundation-sys = "0.8"

[dev-dependencies]
tempfile = "3.10"
filetime = "0.2"
# HD-01 — integration test iterates CaptureEventKindDiscriminants to
# enforce renderer coverage. Test-only dep; no shipped binary cost.
strum = { workspace = true }
