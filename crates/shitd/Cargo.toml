[package]
name = "shitd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "shitd"
path = "src/main.rs"

[features]
# Opt-in OTLP export. Gated because the opentelemetry-otlp + tonic
# transitive graph adds ~40 crates and noticeable cold-build time —
# minimal builds (the default for distro packagers) shouldn't pay
# for a perf-debugging-only feature.
default = []
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[build-dependencies]
vergen-gitcl = { workspace = true }

[dependencies]
shit-proto = { workspace = true }
shit-store = { workspace = true }
shit-planner = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
hdrhistogram = { workspace = true }
libc = { workspace = true }
nix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.10"
