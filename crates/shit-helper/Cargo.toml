[package]
name = "shit-helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "shit-helper"
path = "src/main.rs"

[build-dependencies]
vergen-gitcl = { workspace = true }

[dependencies]
shit-proto = { workspace = true }
shit-planner = { workspace = true }
shit-capture = { workspace = true }
nix = { workspace = true }
libc = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"
bitflags = { workspace = true }
crossbeam-channel = "0.5"
inotify = { version = "0.11", default-features = false }
# aya 0.13 = userspace BPF loader. Linux-only. No program code yet —
# the `ebpf` module is a skeleton whose `load()` returns NotImplemented.
# Stage 3 of S09 adds the program crate + bpf-linker; until then this
# crate is dead-code-imported only.
aya = "0.13"

[dev-dependencies]
tempfile = "3.10"
