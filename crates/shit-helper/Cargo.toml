[package]
name = "shit-helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# B07.6 — small library surface exposing the bench-relevant pieces
# (kqueue::capture::{read_pre_image, stream_copy_to_staging,
# CaptureError}) so the perf-regression bench can measure the real
# hot path without spawning the full helper. main.rs remains the
# canonical entry point; the lib is a deliberately minimal facade.
[lib]
name = "shit_helper"
path = "src/lib.rs"

[[bin]]
name = "shit-helper"
path = "src/main.rs"

[build-dependencies]
vergen-gitcl = { workspace = true }

[dependencies]
shit-proto = { workspace = true }
shit-planner = { workspace = true }
shit-capture = { workspace = true }
nix = { workspace = true }
libc = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"
bitflags = { workspace = true }
crossbeam-channel = "0.5"
inotify = { version = "0.11", default-features = false }
# aya 0.13 = userspace BPF loader. Linux-only. No program code yet —
# the `ebpf` module is a skeleton whose `load()` returns NotImplemented.
# Stage 3 of S09 adds the program crate + bpf-linker; until then this
# crate is dead-code-imported only.
aya = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
# CoreFoundation runloop + string + array types for the FSEvents
# producer (M01) and the EndpointSecurity client (M03). The
# FSEvents `extern "C"` surface lives inline in `src/fsevents.rs`;
# the ES surface lives inline in `src/es/sys.rs`. We vendor both
# rather than depending on wrapper crates to match the project's
# "own the FFI" pattern (shit-capture/src/cow/clonefile_macos.rs,
# our raw kqueue on BSD via libc, etc.). Reference for the ES
# bindings: HarfangLab/endpoint-sec at github.com.
core-foundation = "0.10"
core-foundation-sys = "0.8"

[dev-dependencies]
tempfile = "3.10"
