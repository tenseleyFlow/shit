[package]
name = "shit-preload-shim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "LD_PRELOAD/DYLD_INSERT_LIBRARIES libc-interposition shim for shit-helper (S10 BSD tier)"

[lib]
# `cdylib` produces libshit_preload.{so,dylib} suitable for LD_PRELOAD.
# `rlib` is added so downstream Rust consumers (the `shit install`
# wrapper, the auto-inject helper, the daemon-side install_hook
# config) can reuse the pure-logic prefix matcher / install-pattern
# matcher from this crate without duplicating them. The cdylib still
# adds negligible load-time overhead — the Rust runtime is only paid
# for once, at lib load, regardless of how many crate-types are
# emitted.
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = { workspace = true }
# S24.D: the shim notifies the daemon's shim_listener over a UDS via
# postcard-framed ShimNotification messages defined in shit-proto.
shit-proto = { path = "../shit-proto" }
# C05: pulled in only by the rlib face of the crate for the config
# loader. The cdylib hot path doesn't touch serde / toml — they're
# behind the `install_config::load_*` rlib-only entry points.
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
# M07.A.3.1: macOS needs a tiny C shim for open/openat because their
# variadic ABI doesn't survive Rust's fixed-arity interposers (the
# Apple AArch64 calling convention puts variadic mode-arg on the
# stack while fixed args go in registers — the resulting register/
# stack mismatch silently corrupts the mode arg). The C shim does
# `va_arg(ap, int)` correctly and forwards to a fixed-arity Rust
# function. Linux/BSD don't need this — their open interposers use
# `dlsym(RTLD_NEXT, ...)` and the BSD/Linux variadic ABI keeps
# mode in registers.
cc = "1.0"

[dev-dependencies]
tempfile = "3.10"
