[package]
name = "shit-planner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
shit-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# S11 executor: chown / chmod / utimensat. Used only on Unix-family targets;
# the executor module is unix-only by construction (path semantics differ
# enough on Windows that we'd want a separate impl, not a port).
nix = { workspace = true }
libc = { workspace = true }
blake3 = { workspace = true }
globset = { workspace = true }
# HD-01 — `CaptureEventKind` carries an `EnumDiscriminants` companion
# enum so renderer-coverage tests (`crates/shit/tests/render_*`) can
# iterate every variant + assert each has a render branch.
strum = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = "3.10"
# Integration tests for the descriptor executor stitch shit-desc's
# schema/matcher/parse/interpolate together with the planner's
# `DescriptorExecutor`. Only a dev-dep so prod planner stays small.
shit-desc = { workspace = true }
